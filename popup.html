<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HypeSquad Badge 2026 Web</title>
  <link rel="stylesheet" href="popup.css" />
</head>

<body>
  <div class="window">
    <div class="header">
      <img src="icons/icon16.png" class="header-icon" alt="" />
      <span class="title">HypeSquad Badge 2026 Web</span>
    </div>

    <div class="body">
      <div class="section-title">Select House / Color</div>

      <div class="houses">
        <button class="house-btn" id="btn-bravery" data-id="1">
          <svg class="house-icon bravery-icon" viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
            <path d="M12 2L4 7v6c0 5.25 3.4 10.15 8 11.25 4.6-1.1 8-6 8-11.25V7l-8-5z" />
          </svg>
          <span class="house-name">Bravery</span>
        </button>

        <button class="house-btn" id="btn-brilliance" data-id="2">
          <svg class="house-icon brilliance-icon" viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
            <path d="M12 2l2.8 6.4 6.9.6-5.2 4.6 1.6 6.8-6.1-3.6-6.1 3.6 1.6-6.8-5.2-4.6 6.9-.6L12 2z" />
          </svg>
          <span class="house-name">Brilliance</span>
        </button>

        <button class="house-btn" id="btn-balance" data-id="3">
          <svg class="house-icon balance-icon" viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
            <path d="M12 3L4 7.5V12c0 4.5 3.5 8.5 8 9.5 4.5-1 8-5 8-9.5V7.5L12 3Z" />
          </svg>
          <span class="house-name">Balance</span>
        </button>
      </div>

      <div id="status" class="status hidden"></div>
    </div>

    <div class="footer">
      by <a href="https://dsc.gg/lynx-modz" target="_blank" id="lynx-link">LynxModz</a>
    </div>
  </div>
  <script src="popup.js"></script>
</body>

</html>
